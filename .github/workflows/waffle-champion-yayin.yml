# Waffle Champion menüsünü FTP ile kutuphane.morelmayayincilik.com sunucusuna yükler.
# Sadece elle tetiklenir (Actions sekmesi > "Waffle Champion menüsünü yayına al" > Run workflow).
#
# Bir kerelik kurulum: GitHub > Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER      : FTP sunucu adresi (ör. ftp.morelmayayincilik.com veya 185.15.198.171)
#   FTP_USERNAME    : FTP kullanıcı adı
#   FTP_PASSWORD    : FTP şifresi
#   FTP_SERVER_DIR  : Sunucudaki waffle-champion klasörünün yolu, sonu "/" ile biter
#                     (ör. /kutuphane.morelmayayincilik.com/waffle-champion/)
#   FTP_PROTOCOL    : (isteğe bağlı) "ftps" varsayılan; sunucu desteklemiyorsa "ftp" yazın
name: Waffle Champion menüsünü yayına al

on:
  workflow_dispatch:

concurrency:
  group: waffle-champion-yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dosyaları FTP ile sunucuya yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./waffle-champion/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
